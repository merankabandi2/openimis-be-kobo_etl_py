name: Module tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Django app label of the module in this repository.
  MODULE: kobo_etl
  # Image recipe: be-openimis.json, constraints.txt, overlays/be/ and the
  # OPENIMIS_BE_REF of Dockerfile.be are read from this repository's main branch.
  DIST_REPO: openimis-dist-merankabandi
  DIST_REF: main

jobs:
  test:
    name: manage.py test (image assembly)
    # Organisation self-hosted runner. The job runs in the same Python image as
    # Dockerfile.be; the database service is reached by its service name.
    runs-on: [self-hosted, linux, x64, mera-ci]
    container: python:3.11-slim
    timeout-minutes: 60
    services:
      db:
        # Same database image and tag as compose.db.yml in the dist repository.
        # It seeds the legacy IMIS schema into POSTGRES_DB at start-up.
        image: ghcr.io/openimis/openimis-pgsql:25.04
        env:
          POSTGRES_DB: test_imis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: ci-only-secret
      MODE: DEV
      SITE_ROOT: api
      DB_DEFAULT: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      # Tests run with --keepdb against the database the service seeded, so
      # the test database and DB_NAME are the same pre-seeded database.
      DB_NAME: test_imis
      DB_TEST_NAME: test_imis
      CELERY_BROKER_URL: "memory://openIMIS-test//"
      CELERY_RESULT_BACKEND: "cache+memory://openIMIS-test//"
      OPENSEARCH_DSL_AUTOSYNC: "False"
    steps:
      # The self-hosted runner keeps the workspace between jobs; the assembly
      # below clones into it and expects it empty.
      - name: Empty the workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          rm -f "$HOME/.gitconfig"

      # Same packages as the builder stage of Dockerfile.be, plus jq.
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git jq build-essential libpq-dev libffi-dev libxml2-dev libxslt-dev \
            gettext libcairo2 libpango-1.0-0 libpangocairo-1.0-0

      - name: Check the module-read secrets are configured
        env:
          APP_ID: ${{ secrets.GH_APP_ID }}
          APP_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Secrets GH_APP_ID and GH_APP_PRIVATE_KEY (GitHub App merankabandi-ci-modules) are not available to this repository; the private dist and module repositories cannot be cloned."
            exit 1
          fi

      - name: Mint a read-only token for the private repositories
        id: modules-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: merankabandi2
          repositories: openimis-dist-merankabandi,openimis-be-merankabandi_py,openimis-be-productive_inclusion_py

      - name: Check out this module
        uses: actions/checkout@v4
        with:
          path: current-module
          persist-credentials: false

      - name: Check out the dist repository
        uses: actions/checkout@v4
        with:
          repository: merankabandi2/${{ env.DIST_REPO }}
          ref: ${{ env.DIST_REF }}
          token: ${{ steps.modules-token.outputs.token }}
          path: dist
          persist-credentials: false

      - name: Assemble openimis-be_py as Dockerfile.be does
        run: |
          BE_REF=$(sed -n 's/^ARG OPENIMIS_BE_REF=//p' dist/Dockerfile.be | head -n1)
          test -n "$BE_REF"
          echo "openimis-be_py ref: $BE_REF"
          echo "dist commit: $(git -C dist rev-parse HEAD)"
          git clone --depth 1 --branch "$BE_REF" https://github.com/openimis/openimis-be_py.git openimis
          cp -r dist/overlays/be/. openimis/
          cp dist/constraints.txt openimis/constraints.txt
          # The module under test is installed in editable mode from this
          # checkout instead of the ref pinned in be-openimis.json; every
          # other module keeps its pin.
          jq --arg name "$MODULE" --arg pip "-e $GITHUB_WORKSPACE/current-module" '
            if any(.modules[]; .name == $name)
            then (.modules[] | select(.name == $name) | .pip) = $pip
            else error("module \($name) is not in be-openimis.json") end
          ' dist/be-openimis.json > openimis/openimis.json
          jq -r '.modules[] | "\(.name)\t\(.pip)"' openimis/openimis.json

      - name: Install the assembly requirements
        working-directory: openimis
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt gunicorn celery
          pip install -c constraints.txt -r requirements.txt -r requirements-extra.txt

      - name: Install the pinned modules
        working-directory: openimis/script
        env:
          MODULES_TOKEN: ${{ steps.modules-token.outputs.token }}
        run: |
          # The token rule goes to a per-job file the runner clears, not to the
          # container home, which the self-hosted runner keeps between jobs.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/modules.gitconfig"
          git config --global url."https://x-access-token:${MODULES_TOKEN}@github.com/merankabandi2/".insteadOf "https://github.com/merankabandi2/"
          python modules-requirements.py ../openimis.json > modules-requirements.txt
          pip install -c ../constraints.txt -r modules-requirements.txt
          git config --global --remove-section url."https://x-access-token:${MODULES_TOKEN}@github.com/merankabandi2/"
          pip freeze | grep -i openimis

      - name: Run the module tests
        working-directory: openimis/openIMIS
        run: |
          set -o pipefail
          python manage.py test --keepdb --noinput "$MODULE" 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Summarise the test run
        if: always()
        run: |
          LOG="$RUNNER_TEMP/test.log"
          [ -f "$LOG" ] || { echo "No test log." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### manage.py test $MODULE"
            grep -E '^Ran [0-9]+ tests? in' "$LOG" || echo "No 'Ran N tests' line."
            grep -E '^(OK|FAILED)( |$)' "$LOG" || true
            echo
            echo '```'
            grep -E '^(FAIL|ERROR): ' "$LOG" || echo "No FAIL/ERROR lines."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
